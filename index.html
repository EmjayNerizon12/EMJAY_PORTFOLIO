<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em-jay A. Nerizon</title>
    <link rel="icon" type="image/png" href="profile.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f9fbf9;
            --card-bg: #ffffff;
            --card-border: #143622;
            --text: #143622;
            --text-muted: #4a755d;
            --yellow: #ffb703;
            --green: #2d6a4f;
            --green-light: #d8f3e6;
            --font: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-card {
            position: relative;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;

            padding: 48px 40px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
           width: min(90vw, 480px);
        }

        .loader-card-label {
            position: absolute;
            top: -14px;
            left: 24px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            padding: 4px 12px;
            border-radius: 6px;
            border: 2px solid var(--card-border);
            text-transform: uppercase;
            background: var(--yellow);
            color: #143622;
        }

        .loader-photo-wrap {
            width: clamp(96px, 10vw, 140px);
            height: clamp(96px, 10vw, 140px);
            border-radius: 50%;
            border: 3px solid var(--card-border);
            overflow: hidden;
            background: var(--yellow);
            flex-shrink: 0;
        }

        .loader-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
        }

        .loader-name {
            font-family: var(--font);
            font-size: clamp(1.25rem, 2vw, 1.6rem);
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.02em;
            text-align: center;
            margin-top: 4px;
        }

        .loader-role {
            font-family: var(--font);
            font-size: clamp(0.75rem, 1vw, 0.95rem);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
        }

        .loader-bar-track {
            width: 100%;
            height: 10px;
            border: 2px solid var(--card-border);
            border-radius: 6px;
            background: var(--green-light);
            overflow: hidden;
            margin-top: 8px;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: var(--green);
            border-radius: 4px;
        }

        .loader-status {
            font-family: var(--font);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .loader-btn {
            margin-top: 4px;
            padding: clamp(10px, 1.2vw, 14px) clamp(28px, 3vw, 40px);
            font-family: var(--font);
            font-size: clamp(0.8rem, 1vw, 1rem);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: var(--yellow);
            color: var(--card-border);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .loader-btn:hover {
            transform: translate(-1px, -1px);
        }

        .loader-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--card-border);
        }

        .loader-progress {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="loader-card">
        <span class="loader-card-label">PORTFOLIO</span>

        <div class="loader-photo-wrap">
            <img src="profile.jpeg" alt="Em-jay Nerizon" class="loader-photo">
        </div>

        <h2 class="loader-name">Em-jay A. Nerizon</h2>
        <p class="loader-role">Web Developer &nbsp;&middot;&nbsp; Programmer</p>

        <div class="loader-progress" id="loaderProgress">
            <div class="loader-bar-track">
                <div class="loader-bar" id="loaderBar"></div>
            </div>
            <span class="loader-status" id="loaderStatus">Loading...</span>
        </div>

        <button class="loader-btn" id="loaderBtn">View Portfolio</button>
    </div>

    <script>
        document.getElementById('loaderBtn').addEventListener('click', function () {
            this.style.display = 'none';
            document.getElementById('loaderProgress').style.display = 'flex';

            const bar = document.getElementById('loaderBar');
            const status = document.getElementById('loaderStatus');
            const DURATION = 3000;
            const messages = [
                { at: 0,  text: 'Loading...' },
                { at: 30, text: 'Fetching assets...' },
                { at: 65, text: 'Almost there...' },
                { at: 90, text: 'Ready!' }
            ];
            const start = performance.now();

            function frame(now) {
                const progress = Math.min(((now - start) / DURATION) * 100, 100);
                bar.style.width = progress + '%';
                const msg = messages.filter(m => progress >= m.at).pop();
                if (msg) status.textContent = msg.text;
                if (progress < 100) {
                    requestAnimationFrame(frame);
                } else {
                    window.location.href = 'v3/index.html';
                }
            }

            requestAnimationFrame(frame);
        });
    </script>

</body>
</html>
